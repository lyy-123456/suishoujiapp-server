name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 快：不依赖数据库，用 pg-mem（内存版 Postgres）跑同一套端到端用例
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test（pg-mem，无需数据库）
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify migration SQL is up to date
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- drizzle; then
            echo "❌ schema.ts 改了但没重新生成迁移：请本地跑 npx drizzle-kit generate 并提交 drizzle/ 变更"
            git diff --stat -- drizzle
            exit 1
          fi
          echo "✅ 迁移与 schema 一致"

  # 慢但更可信：同一套用例跑在真实 PostgreSQL 16 上（pg-mem 是仿真，个别语法可能与真库有差异）
  verify-real-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test against real PostgreSQL
        run: npm test
