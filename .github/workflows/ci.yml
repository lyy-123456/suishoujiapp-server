name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify migration SQL is up to date
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- drizzle; then
            echo "❌ schema.ts 改了但没重新生成迁移：请本地跑 npx drizzle-kit generate 并提交 drizzle/ 变更"
            git diff --stat -- drizzle
            exit 1
          fi
          echo "✅ 迁移与 schema 一致"
