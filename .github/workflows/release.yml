name: Release Image

# 构建后端镜像并推送到 GitHub Container Registry（ghcr.io）
# 服务器只负责 pull，不在 2C2G 上构建（构建峰值 1~2GB，容易 OOM）
#
# 推送的 tag：
#   latest        —— 仅 main 分支
#   <package.json 版本号>，如 0.1.0
#   sha-xxxxxxx   —— 便于回滚到具体提交

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version & image name
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"
          echo "镜像:   $IMAGE"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.prep.outputs.version }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 双架构：不确定服务器是 x86 还是 ARM，都构建（用 QEMU，慢一点但省心）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.prep.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "服务器上更新："
            echo '```bash'
            echo "cd /opt/suishouji && ./update.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
